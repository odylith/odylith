name: release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build one signed draft, or promote the qualified exact draft
        required: true
        type: choice
        options: [candidate, promote]
      tag:
        description: Reserved stable release tag
        required: true
        type: string
      expected_sha:
        description: Exact canonical H reserved by the maintainer release session
        required: true
        type: string
      promotion:
        description: Closed exact-D tuple from the local qualification owner; promotion only
        required: false
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
    env:
      ODYLITH_RELEASE_REPO: odylith/odylith
      ODYLITH_RELEASE_ACTOR: freedom-research
      ODYLITH_RELEASE_REF: refs/heads/main
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
      ODYLITH_PROMOTION_BINDING: ${{ inputs.promotion }}
    steps:
      - name: Authorize canonical release owner and data inputs
        run: |
          [[ "$GITHUB_REPOSITORY" == "$ODYLITH_RELEASE_REPO" ]] || exit 2
          [[ "$GITHUB_ACTOR" == "$ODYLITH_RELEASE_ACTOR" ]] || exit 2
          [[ "$GITHUB_REF" == "$ODYLITH_RELEASE_REF" ]] || exit 2
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          [[ "$RELEASE_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$RELEASE_OPERATION" == candidate || "$RELEASE_OPERATION" == promote ]] || exit 2
          [[ "$GITHUB_SHA" == "$RELEASE_EXPECTED_SHA" ]] || exit 2
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify tag and clean canonical H
        run: |
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$RELEASE_EXPECTED_SHA" ]] || exit 2
          [[ "$(git rev-parse HEAD)" == "$RELEASE_EXPECTED_SHA" ]] || exit 2
          [[ -z "$(git status --porcelain)" ]] || exit 2
          python scripts/validate_git_identity.py history --repo-root . HEAD
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.13'
      - name: Install release tooling
        run: python -m pip install --upgrade virtualenv==20.31.1 hatch==1.14.1
      - name: Sync Hatch environment
        run: hatch env create
      - name: Reserve candidate before any package build
        if: inputs.operation == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ ! -e dist && ! -L dist ]] || exit 2
          hatch run python scripts/release/hosted_release_custody.py reserve --tag "$RELEASE_TAG" --revision "$RELEASE_EXPECTED_SHA" --output "$RUNNER_TEMP/odylith-candidate-reservation.json"
          mkdir "$RUNNER_TEMP/odylith-candidate-logs"
      - name: Validate self-host release posture
        if: inputs.operation == 'candidate'
        run: |
          hatch run python scripts/sync_version_truth.py --repo-root . release-check --expected-version "${RELEASE_TAG#v}"
          hatch run python -m odylith.cli governance sync-component-spec-requirements --repo-root . --check-only
          hatch run python -m odylith.cli validate self-host-posture --repo-root . --mode release --expected-tag "$RELEASE_TAG"
      - name: Build one wheel
        if: inputs.operation == 'candidate'
        run: hatch build --target wheel dist 2>&1 | tee "$RUNNER_TEMP/odylith-candidate-logs/hosted-wheel.log"
      - name: Generate and sign candidate assets once
        if: inputs.operation == 'candidate'
        run: hatch run python scripts/release/publish_release_assets.py --repo "$ODYLITH_RELEASE_REPO" --tag "$RELEASE_TAG" --dist-dir dist --candidate 2>&1 | tee "$RUNNER_TEMP/odylith-candidate-logs/hosted-assets.log"
      - name: Check package domain leakage
        if: inputs.operation == 'candidate'
        run: hatch run python scripts/release/platform_domain_leakage_check.py --repo-root . --dist-dir dist
      - name: Verify signed installed candidate
        if: inputs.operation == 'candidate'
        env:
          ODYLITH_RELEASE_REQUIRE_SIGSTORE_VERIFY: '1'
        run: hatch run python scripts/release/local_release_smoke.py --version "${RELEASE_TAG#v}" --dist-dir dist 2>&1 | tee "$RUNNER_TEMP/odylith-candidate-logs/hosted-smoke.log"
      - name: Stage completed signed draft
        if: inputs.operation == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: hatch run python scripts/release/hosted_release_custody.py stage --reservation "$RUNNER_TEMP/odylith-candidate-reservation.json" --dist-dir dist
      - name: Promote exact qualified candidate without build or signing
        if: inputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
        run: hatch run python scripts/release/hosted_release_custody.py promote
