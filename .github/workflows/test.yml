name: test

on:
  push:
  pull_request:

jobs:
  identity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Validate commit identities
        run: python scripts/validate_git_identity.py history --repo-root . HEAD

  pytest:
    runs-on: ubuntu-24.04
    needs: identity
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Install Hatch
        run: python -m pip install --upgrade virtualenv==20.31.1 hatch==1.14.1
      - name: Sync Hatch environment
        run: hatch env create
      - name: Run tests
        run: hatch run pytest -q

  claude-assets-smoke:
    runs-on: ubuntu-24.04
    needs: identity
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
      - name: Validate Claude project assets
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          assert "@AGENTS.md" in (root / "CLAUDE.md").read_text(encoding="utf-8")
          assert (root / ".claude" / "CLAUDE.md").is_file()
          assert (root / ".claude" / "settings.json").is_file()
          commands = root / ".claude" / "commands"
          expected = {
              "odylith-start.md",
              "odylith-context.md",
              "odylith-query.md",
              "odylith-sync-governance.md",
          }
          missing = sorted(name for name in expected if not (commands / name).is_file())
          assert not missing, f"Missing Claude command assets: {missing}"
          PY
